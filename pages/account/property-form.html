<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حساب المالك | وسيط</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/reset.css"><link rel="stylesheet" href="../../css/typography.css"><link rel="stylesheet" href="../../css/base.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/layouts/account.css"><link rel="stylesheet" href="../../css/responsive.css"><link rel="stylesheet" href="../../css/property-cards.css"><link rel="stylesheet" href="../../css/pages/owner.css"><script type="module" src="../../js/account/owner.js"></script></head><body data-owner-page="property-form"><a class="w-skip" href="#main-content">انتقل إلى المحتوى</a><div data-component="components/account/shell.html"></div><template id="owner-content"><div class="o-heading"><div><h1 id="form-title">إضافة عقار جديد</h1><p>أدخل بيانات العقار خطوة بخطوة، ثم أرسلها للمراجعة.</p></div></div><p class="o-notice" id="edit-warning" hidden>السعر والصور والوصف وباقي التعديلات تبقى قيد المراجعة. تظل النسخة المعتمدة منشورة حتى موافقة الإدارة.</p><ol class="o-stepper" id="steps"><li data-step-label="0"><b>1</b>المعلومات الأساسية</li><li data-step-label="1"><b>2</b>المواصفات</li><li data-step-label="2"><b>3</b>الموقع</li><li data-step-label="3"><b>4</b>الصور</li><li data-step-label="4"><b>5</b>المراجعة</li></ol>
<form class="o-panel" id="owner-form" novalidate>
<fieldset data-step="0"><legend>المعلومات الأساسية</legend><label class="w-field">عنوان الإعلان *<input name="title" type="text" required minlength="3" maxlength="150"><small class="o-error" data-error="title"></small></label><div class="o-grid"><label class="w-field">نوع المعاملة *<select name="listing_type" required></select><small class="o-error" data-error="listing_type"></small></label><label class="w-field">نوع العقار *<select name="category" ></select><small class="o-error" data-error="category"></small></label><label class="w-field">التصنيف الفرعي *<select name="property_type_id" required></select><small class="o-error" data-error="property_type_id"></small></label></div><label class="w-field">وصف العقار *<textarea name="description" rows="6" required maxlength="2000"></textarea><small class="o-error" data-error="description"></small></label></fieldset>
<fieldset data-step="1" hidden><legend>مواصفات العقار</legend><div class="o-grid"><label class="w-field">السعر بالجنيه *<input name="price" type="number" required min="1" step="1"><small class="o-error" data-error="price"></small></label><label class="w-field">المساحة بالمتر المربع *<input name="size_m2" type="number" required min="0.01" step="0.01"><small class="o-error" data-error="size_m2"></small></label><label class="w-field">فترة الإيجار<select name="rent_period" required></select><small class="o-error" data-error="rent_period"></small></label><label class="w-field">غرف النوم<input name="bedrooms" type="number" min="0" max="200" step="1"><small class="o-error" data-error="bedrooms"></small></label><label class="w-field">الحمامات<input name="bathrooms" type="number" min="0" max="200" step="1"><small class="o-error" data-error="bathrooms"></small></label><label class="w-field">مستوى التشطيب<select name="finishing_type" ></select><small class="o-error" data-error="finishing_type"></small></label><label class="w-field">الدور<input name="floor" type="number" min="0" max="200" step="1"><small class="o-error" data-error="floor"></small></label></div></fieldset>
<fieldset data-step="2" hidden><legend>موقع العقار</legend><div class="o-grid"><label class="w-field">المدينة<input value="مدينة السادات، المنوفية" disabled></label><label class="w-field">الحي أو المنطقة *<select name="area_id" required></select><small class="o-error" data-error="area_id"></small></label></div><p class="o-notice">يُستخدم الحي المسجل فقط. لا تتوفر إحداثيات أو خريطة معتمدة.</p></fieldset>
<fieldset data-step="3" hidden><legend>صور العقار</legend><label class="o-upload">اضغط لاختيار الصور<input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>JPG أو PNG أو WebP · حتى 6 صور · مجموع الملفات الجديدة حتى 2 ميجابايت لحفظ الجلسة.</small></label><p class="o-error" id="image-error" role="alert"></p><div class="o-images" id="images"></div></fieldset>
<fieldset data-step="4" hidden><legend>راجع الإعلان قبل الإرسال</legend><div id="review-card" class="o-review"></div><p class="o-notice">الإعلان يحتاج موافقة الإدارة قبل النشر. لن تُنشر التعديلات تلقائيًا.</p></fieldset>
<div class="o-form-footer"><button type="button" class="w-button w-button--secondary" id="previous">الخطوة السابقة</button><button type="submit" class="w-button w-button--primary" id="next">التالي</button></div></form></template><dialog class="w-modal" id="owner-dialog" aria-labelledby="owner-dialog-title"><div class="w-modal-header"><h2 id="owner-dialog-title"></h2><button class="w-icon-button" data-close-dialog aria-label="إغلاق">×</button></div><div class="w-modal-body"><p id="owner-dialog-copy"></p><div class="w-modal-actions"><button class="w-button w-button--secondary" data-close-dialog>إلغاء</button><button class="w-button w-button--primary" id="confirm-action">تأكيد</button></div></div></dialog><div data-component="components/public/property-card.html"></div><noscript>يلزم تفعيل جافاسكريبت.</noscript></body></html>
